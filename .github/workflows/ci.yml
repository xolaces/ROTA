name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # CI gates on the hermetic unit tests only. The integration tests use
      # Testcontainers (Docker Postgres/Redis) and are flaky on GitHub-hosted
      # runners (Docker Hub pull limits, Ryuk reaper) — run them locally
      # (`dotnet test tests/ROTA.IntegrationTests`, Docker required).
      - name: Unit tests
        run: dotnet test tests/ROTA.UnitTests --configuration Release --no-build

      # T67 migration gate: MigrationSnapshotTests (in the unit suite above) fails
      # the build when the EF model drifts from the last migration's snapshot —
      # hermetic (no DB, no dotnet-ef, no env vars), so no extra step is needed.

  # T66/T67 — proves the production image assembles (and that publish carries
  # content/). The image is build-verified only, never pushed from CI.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t rota-api:ci .
